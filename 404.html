<!DOCTYPE html>
<html lang="ru-RU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Гранитная мастерская «ГраалЬ»</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .notfound { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
    .notfound-code { font-family: var(--serif); font-size: clamp(5rem, 18vw, 11rem); line-height: 0.85; color: var(--bronze); }
    .notfound h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(1.8rem, 5vw, 2.6rem); margin-top: 18px; }
    .notfound p { color: var(--muted); margin-top: 14px; }
    .notfound .btn { margin-top: 30px; }
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <div class="notfound-code">404</div>
      <h1>Такой страницы нет</h1>
      <p>Возможно, ссылка устарела или в адресе опечатка.</p>
      <a class="btn btn--solid" href="index.html">На главную</a>
    </div>
  </main>
</body>
</html>
